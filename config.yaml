# Settings for training (src/02_train.py) and inference (src/03_inference.py).
# Paths are relative to the repository root.

model:
  # Base model on the Hugging Face Hub. Alternatives with the same prompt format:
  # - "mistralai/Mistral-7B-Instruct-v0.2"
  base_model_id: "mistralai/Mistral-7B-Instruct-v0.3"

paths:
  dataset: "data/legionaer_training_data.json"
  checkpoints: "models/legionaer-sft"      # training checkpoints
  lora_adapter: "models/legionaer-final"   # final LoRA adapters
  export: "models/legionaer-deployed"      # export for the Hugging Face Hub

quantization:
  use_4bit: true            # true: ~4-5 GB VRAM (T4); false: float16, ~15 GB VRAM
  quant_type: "nf4"         # NormalFloat4
  double_quant: true        # quantise the quantisation constants too (training only)

lora:
  rank: 16                  # width of the adapter matrices
  alpha: 32                 # scaling factor, usually 2x rank
  dropout: 0.05             # against overfitting
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]   # all attention projections

training:
  num_epochs: 5
  batch_size: 4             # examples per GPU step
  gradient_accumulation_steps: 1         # effective batch size = 4 * 1 = 4
  learning_rate: 0.0002
  warmup_ratio: 0.1         # warm up during the first 10% of the steps
  weight_decay: 0.01        # L2 regularisation
  max_seq_length: 512
  packing: false            # true packs short examples together, but then there are far fewer steps
  optimizer: "paged_adamw_32bit"
  save_steps: 100
  logging_steps: 5
  save_total_limit: 3

inference:
  max_new_tokens: 256
  temperature: 0.7          # 0 = deterministic, 1 = creative
  top_p: 0.9                # nucleus sampling
